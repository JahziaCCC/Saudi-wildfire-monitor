name: Daily Wildfire Monitor Automation

on:
  schedule:
    # يعمل تلقائياً يومياً الساعة 5:00 صباحاً بتوقيت غرينتش (8:00 صباحاً بتوقيت السعودية)
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  run-wildfire-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup R Environment
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libproj-dev libgeos-dev libudunits2-dev libcurl4-openssl-dev libuv1-dev libssl-dev libxml2-dev

      - name: Install Required R Packages
        run: |
          Rscript -e 'install.packages(c("sf", "leaflet", "dplyr", "readr", "httr2", "jsonlite", "htmlwidgets", "fs"), repos="https://cloud.r-project.org")'

      - name: Execute Wildfire Monitoring Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          Rscript "final code.R"
